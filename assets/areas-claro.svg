<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 306" width="1200" height="306" role="img" aria-label="Qué hago: desarrollo (aplicaciones web y nuevas funcionalidades, integraciones con APIs, pruebas), interfaces (UX/UI, bocetos y prototipos) e IA aplicada (agentes con Claude Code, configuración y orquestación)"><style>.sans{font-family:'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif}.mono{font-family:ui-monospace,'SFMono-Regular','Cascadia Code',Menlo,Consolas,monospace}@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}@keyframes march{to{stroke-dashoffset:-44}}@media (prefers-reduced-motion:reduce){*{animation:none!important}.tapa,.cur,.anim-solo{display:none}}.cd{animation:up .7s cubic-bezier(.2,.8,.2,1) both}.bar{transform-box:fill-box;transform-origin:left;animation:bar 8s cubic-bezier(.6,0,.2,1) infinite both}@keyframes bar{0%{transform:scaleX(0)}9%,100%{transform:scaleX(1)}}.d0,.d0 .bar{animation-delay:.1s}.d1,.d1 .bar{animation-delay:.35s}.d2,.d2 .bar{animation-delay:.6s}.cc{animation:blink 1.1s step-end infinite}@keyframes blink{50%{opacity:0}}.wf{transform-box:fill-box;transform-origin:left;animation:wf 6s cubic-bezier(.2,.8,.2,1) infinite both}.wf1{animation-delay:.9s}.wf2{animation-delay:1.1s}.wf3{animation-delay:1.3s}@keyframes wf{0%{transform:scaleX(0);opacity:0}8%,85%{transform:none;opacity:1}95%,100%{transform:scaleX(0);opacity:0}}.viaje{animation:viaje 3.6s ease-in-out infinite}@keyframes viaje{0%,100%{transform:translate(0px,0px)}33%{transform:translate(44px,0px)}66%{transform:translate(22px,-36px)}}.nodo{transform-box:fill-box;transform-origin:center;animation:nodo 3.6s ease-in-out infinite}.n2{animation-delay:1.2s}.n3{animation-delay:2.4s}@keyframes nodo{0%,20%,100%{transform:none}8%{transform:scale(1.35)}}</style><rect width="1200" height="306" rx="18" fill="#FAF8F4"/><rect x="0.5" y="0.5" width="1199" height="305" rx="18" fill="none" stroke="#E3DDD2"/><text x="40" y="48" class="mono" font-size="16" fill="#6F665C" letter-spacing="1.5">QUÉ HAGO</text><g class="cd d0"><rect x="40" y="70" width="350" height="206" rx="16" fill="#FFFFFF" stroke="#E3DDD2" stroke-width="2"/><rect x="40" y="70" width="350" height="6" class="bar" rx="3" fill="#151515"/><text x="66" y="122" class="sans" font-size="30" font-weight="700" fill="#151515">Desarrollo</text><text x="66" y="170" class="sans" font-size="18" fill="#2A2A2A">Aplicaciones web y funcionalidades</text><text x="66" y="204" class="sans" font-size="18" fill="#2A2A2A">Integraciones con APIs</text><text x="66" y="238" class="sans" font-size="18" fill="#2A2A2A">Pruebas manuales y automatizadas</text><text x="302" y="120" class="mono" font-size="28" font-weight="700" fill="#6F665C">&lt;/&gt;</text><rect class="cc" x="362" y="98" width="3" height="26" fill="#151515"/></g><g class="cd d1"><rect x="420" y="70" width="350" height="206" rx="16" fill="#FFFFFF" stroke="#E3DDD2" stroke-width="2"/><rect x="420" y="70" width="350" height="6" class="bar" rx="3" fill="#E4572E"/><text x="446" y="122" class="sans" font-size="30" font-weight="700" fill="#151515">Interfaces</text><text x="446" y="170" class="sans" font-size="18" fill="#2A2A2A">Diseño UX/UI</text><text x="446" y="204" class="sans" font-size="18" fill="#2A2A2A">Bocetos y prototipos</text><text x="446" y="238" class="sans" font-size="18" fill="#2A2A2A">La experiencia de quien la usa</text><g transform="translate(682 92)"><rect width="64" height="44" rx="6" fill="none" stroke="#6F665C" stroke-width="2"/><rect class="wf wf1" x="6" y="6" width="52" height="7" rx="3" fill="#E4572E"/><rect class="wf wf2" x="6" y="18" width="24" height="20" rx="3" fill="#E3DDD2"/><rect class="wf wf3" x="34" y="18" width="24" height="20" rx="3" fill="#E3DDD2"/></g></g><g class="cd d2"><rect x="800" y="70" width="350" height="206" rx="16" fill="#FFFFFF" stroke="#E3DDD2" stroke-width="2"/><rect x="800" y="70" width="350" height="6" class="bar" rx="3" fill="#2F5BEA"/><text x="826" y="122" class="sans" font-size="30" font-weight="700" fill="#151515">IA aplicada</text><text x="826" y="170" class="sans" font-size="18" fill="#2A2A2A">Agentes de IA con Claude Code</text><text x="826" y="204" class="sans" font-size="18" fill="#2A2A2A">Configuro memoria, reglas y MCP</text><text x="826" y="238" class="sans" font-size="18" fill="#2A2A2A">Orquestación con revisores</text><g transform="translate(1068 128)"><path d="M0 0 L44 0 L22 -36 Z" fill="none" stroke="#E3DDD2" stroke-width="2"/><circle class="nodo" cx="0" cy="0" r="6" fill="#2F5BEA"/><circle class="nodo n2" cx="44" cy="0" r="6" fill="#2F5BEA"/><circle class="nodo n3" cx="22" cy="-36" r="6" fill="#2F5BEA"/><circle class="viaje" cx="0" cy="0" r="4" fill="#151515"/></g></g></svg>