<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" width="1200" height="330" role="img" aria-label="Erik Ruiz Alos — Desarrollador de software, interfaces y agentes de IA. Técnico Superior en DAW, Alcalá la Real (Jaén)"><style>.sans{font-family:'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif}.mono{font-family:ui-monospace,'SFMono-Regular','Cascadia Code',Menlo,Consolas,monospace}@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}@keyframes march{to{stroke-dashoffset:-44}}@media (prefers-reduced-motion:reduce){*{animation:none!important}.tapa,.cur,.anim-solo{display:none}}.tapa{transform-box:fill-box;transform-origin:right;animation:tapa 1.6s steps(40,end) .5s both}@keyframes tapa{from{transform:scaleX(1)}to{transform:scaleX(0)}}.cur{animation:cur 1.6s steps(40,end) .5s both,blink 1.1s step-end 2.1s 3,fuera .3s 5.4s forwards}@keyframes fuera{to{opacity:0}}@keyframes cur{from{transform:translateX(-686px)}to{transform:none}}@keyframes blink{50%{opacity:0}}.raya{transform-box:fill-box;transform-origin:left;animation:raya .8s cubic-bezier(.2,.8,.2,1) .2s both}@keyframes raya{from{transform:scaleX(0)}to{transform:none}}.flota{animation:flota 6s ease-in-out infinite}.f2{animation-delay:-3s}@keyframes flota{50%{transform:translateY(-6px)}}.dado{transform-box:fill-box;transform-origin:center;animation:dado 9s cubic-bezier(.5,0,.2,1) 2.5s infinite}@keyframes dado{0%,82%{transform:none}90%{transform:rotate(-14deg) scale(1.06)}96%{transform:rotate(6deg)}100%{transform:none}}.ln{transform-box:fill-box;transform-origin:left;animation:ln 5s cubic-bezier(.2,.8,.2,1) infinite both}.l1{animation-delay:.25s}.l2{animation-delay:.5s}@keyframes ln{0%{transform:scaleX(0)}14%,88%{transform:none}100%{transform:scaleX(0)}}.boton{transform-box:fill-box;transform-origin:center;animation:boton 5s ease-in-out 1s infinite}@keyframes boton{0%,30%,40%,100%{transform:none}35%{transform:scale(.88)}}.dash{animation:march 2.4s linear infinite}.late{transform-box:fill-box;transform-origin:center;animation:late 3s ease-in-out infinite}@keyframes late{50%{transform:scale(1.12);opacity:.6}}.orb{animation:orb 4s linear infinite}@keyframes orb{to{transform:rotate(360deg)}}</style><rect width="1200" height="330" rx="18" fill="#0F1115"/><rect x="0.5" y="0.5" width="1199" height="329" rx="18" fill="none" stroke="#262B36"/><text x="60" y="150" class="sans" font-size="92" font-weight="700" fill="#F4F1EC" letter-spacing="-3">Erik Ruiz Alos</text><rect class="raya" x="64" y="176" width="72" height="6" rx="3" fill="#FF6B42"/><text x="64" y="232" class="sans" font-size="28" fill="#D9D5CE"><tspan font-weight="700" fill="#F4F1EC">Desarrollador de software</tspan> · interfaces y agentes de IA</text><rect class="tapa" x="62" y="202" width="688" height="40" fill="#0F1115"/><rect class="cur" x="750" y="208" width="3" height="30" fill="#FF6B42"/><text x="64" y="278" class="mono" font-size="18" fill="#9AA2B1">Técnico Superior en DAW  ·  Alcalá la Real, Jaén</text><g transform="translate(820 52)"><g class="flota"><g class="dado"><polygon points="70.0,26.0 127.2,59.0 127.2,125.0 70.0,158.0 12.8,125.0 12.8,59.0" fill="#F4F1EC"/><line x1="70.0" y1="26.0" x2="70.0" y2="55.7" stroke="#0F1115" stroke-width="2.5"/><line x1="127.2" y1="59.0" x2="70.0" y2="55.7" stroke="#0F1115" stroke-width="2.5"/><line x1="127.2" y1="59.0" x2="104.3" y2="113.1" stroke="#0F1115" stroke-width="2.5"/><line x1="127.2" y1="125.0" x2="104.3" y2="113.1" stroke="#0F1115" stroke-width="2.5"/><line x1="70.0" y1="158.0" x2="104.3" y2="113.1" stroke="#0F1115" stroke-width="2.5"/><line x1="70.0" y1="158.0" x2="35.7" y2="113.1" stroke="#0F1115" stroke-width="2.5"/><line x1="12.8" y1="125.0" x2="35.7" y2="113.1" stroke="#0F1115" stroke-width="2.5"/><line x1="12.8" y1="59.0" x2="35.7" y2="113.1" stroke="#0F1115" stroke-width="2.5"/><line x1="12.8" y1="59.0" x2="70.0" y2="55.7" stroke="#0F1115" stroke-width="2.5"/><polygon points="70.0,55.7 104.3,113.1 35.7,113.1" fill="none