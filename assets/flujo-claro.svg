<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 232" width="1200" height="232" role="img" aria-label="Cómo trabajo con IA: contexto (memoria, reglas, skills), agentes que hacen las tareas, revisores que comprueban el trabajo y devuelven correcciones, y resultado revisado"><style>.sans{font-family:'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif}.mono{font-family:ui-monospace,'SFMono-Regular','Cascadia Code',Menlo,Consolas,monospace}@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}@keyframes march{to{stroke-dashoffset:-44}}@media (prefers-reduced-motion:reduce){*{animation:none!important}.tapa,.cur,.anim-solo{display:none}}.caja{animation:up .6s cubic-bezier(.2,.8,.2,1) both}.k0{animation-delay:.1s}.k1{animation-delay:.3s}.k2{animation-delay:.5s}.k3{animation-delay:.7s}.vuelta{animation:march 2.4s linear infinite}.fluye{animation:march 1.6s linear infinite}.pkt{animation:pkt 9s cubic-bezier(.5,0,.5,1) 1.2s infinite both}.e1{animation-delay:1.27s}.e2{animation-delay:1.3399999999999999s}@keyframes pkt{0%{transform:translate(160px,136px);opacity:0}4%{opacity:1}16%{transform:translate(450px,136px)}30%{transform:translate(740px,136px)}38%{transform:translate(740px,84px)}46%{transform:translate(595px,52px)}54%{transform:translate(450px,84px)}60%{transform:translate(450px,136px)}72%{transform:translate(740px,136px)}86%{transform:translate(1030px,136px);opacity:1}92%,100%{transform:translate(1030px,136px);opacity:0}}.brillo{opacity:0;animation:9s ease-out 1.2s infinite both}.g0{animation-name:g0}.g1{animation-name:g1}.g2{animation-name:g2}.g3{animation-name:g3}@keyframes g0{0%{opacity:0}3%{opacity:1}10%,100%{opacity:0}}@keyframes g1{0%,14%{opacity:0}17%{opacity:1}24%,57%{opacity:0}61%{opacity:1}68%,100%{opacity:0}}@keyframes g2{0%,28%{opacity:0}31%{opacity:1}38%,70%{opacity:0}73%{opacity:1}80%,100%{opacity:0}}@keyframes g3{0%,84%{opacity:0}87%{opacity:1}97%,100%{opacity:0}}.sello{opacity:0;transform-box:fill-box;transform-origin:center;animation:9s cubic-bezier(.2,.8,.2,1) 1.2s infinite both}.mal{animation-name:mal}.bien{animation-name:bien}@keyframes mal{0%,29%{opacity:0;transform:scale(0)}32%{opacity:1;transform:scale(1.2)}34%,50%{opacity:1;transform:none}54%,100%{opacity:0;transform:none}}@keyframes bien{0%,71%{opacity:0;transform:scale(0)}74%{opacity:1;transform:scale(1.2)}76%,94%{opacity:1;transform:none}98%,100%{opacity:0}}.check{stroke-dasharray:1;animation:check 9s ease-out 1.2s infinite both}@keyframes check{0%,86%{stroke-dashoffset:1}91%,97%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:0;opacity:0}}</style><rect width="1200" height="232" rx="18" fill="#FAF8F4"/><rect x="0.5" y="0.5" width="1199" height="231" rx="18" fill="none" stroke="#E3DDD2"/><text x="40" y="48" class="mono" font-size="16" fill="#6F665C" letter-spacing="1.5">CÓMO TRABAJO CON IA</text><circle class="pkt e2" cx="0" cy="0" r="5" fill="#2F5BEA" opacity="0.35"/><circle class="pkt e1" cx="0" cy="0" r="7" fill="#2F5BEA" opacity="0.6"/><circle class="pkt " cx="0" cy="0" r="9" fill="#2F5BEA" opacity="1"/><g class="caja k0"><rect x="40" y="84" width="240" height="104" rx="16" fill="#FFFFFF" stroke="#E3DDD2" stroke-width="2"/><text x="64" y="130" class="sans" font-size="26" font-weight="700" fill="#151515">contexto</text><text x="64" y="162" class="mono" font-size="14" fill="#151515" opacity=".8">memoria · reglas · skills</text><rect class="brillo g0" x="36" y="80" width="248" height="112" rx="19" fill="none" stroke="#2F5BEA" stroke-width="3"/></g><g class="caja k1"><rect x="330" y="84" width="240" height="104" rx="16" fill="#151515" stroke="#151515" stroke-width="2"/><text x="354" y="130" class="sans" font-size="26" font-weight="700" fill="#FAF8F4">agentes</text><text x="354" y="162" class="mono" font-size="14" fill="#FAF8F4" opacity=".8">hacen las tareas</text><rect class="brillo g1" x="326" y="80" width="248" height="112" rx="19" fill="none" stroke="#2F5BEA" stroke-width="3"/></g><g class="caja k2"><rect 